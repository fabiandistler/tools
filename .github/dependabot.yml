# Keeps the SHA-pinned actions current (zizmor's unpinned-uses audit blocks tag refs).
# zizmor's dependabot-cooldown audit fails a cooldown under 7 days.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      uv:
        patterns: ["*"]
        update-types: [minor, patch]
