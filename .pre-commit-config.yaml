# Generated by setup-hooks.sh on 2026-11-19. Runner: prek.
# Update revs with 'prek update --cooldown-days 7'.
# Base: generic hooks via pre-commit/pre-commit-hooks.
# prek recognizes this repo URL and runs its Rust implementation instead
# (automatic fast path). The config still runs under the original pre-commit.
# Cost: prek clones the repo anyway and creates a Python venv as a fallback.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      # Shebang and executable bit must agree. Both hooks read the mode from
      # the git index when core.fileMode=false (WSL on /mnt/c, Windows), so
      # the result does not depend on the filesystem; ruff skips its EXE rules
      # on WSL (#93). Bats files keep their `#!/usr/bin/env bats` line at
      # 100644: `bats test/` runs them, not the shell.
      - id: check-shebang-scripts-are-executable
        exclude: '\.bats$'
      - id: check-executables-have-shebangs

  # Agent context budget, included for every project type: blocks staged
  # text files over 5000 tokens (tokens = bytes / 4) and prints how to split
  # them. setup-hooks.sh copies the script into scripts/hooks/; lockfiles,
  # minified bundles and generated or vendored files (generator banner, or
  # linguist-generated / linguist-vendored in .gitattributes) are skipped.
  # bash runs it, so a lost executable bit does not break the hook.
  - repo: local
    hooks:
      - id: check-file-tokens
        name: files stay under 5000 tokens (bytes / 4)
        entry: bash scripts/hooks/check-file-tokens.sh
        language: system
        types: [text]
        # Hand edit after generation. Owner decision 2026-11-19: the limit
        # applies to new files; the root tools below were already over it and
        # are exempt by name. A tool is one .html file, so the hook's advice to
        # split does not fit it, and past ~400 lines a tool ships tests instead
        # of cutting scope. Size and bug data: issues #11-#16.
        exclude: '^(attention|dfbetas-influence|einsingen|evo-algo|gender-pay-gap|lineare-regression|mincer-gleichung|monotonie-constraints|netzwerk-schichten|skill|tool-pattern)\.html$'

  # Python: formatting and linting.
  # ruff-check runs before ruff-format so --fix results still get formatted.
  # Since ruff 0.16, 413 rules (not 59) are default, so the first run in an
  # existing repo reports many findings. Keep the default (extend-select,
  # never select); clear them with ruff check --fix, then --add-noqa.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Typechecker. ty is at 0.0.x — chosen deliberately early (uv-native, fast).
  # Conservative alternative: replace this block with
  #   - repo: https://github.com/pre-commit/mirrors-mypy
  #     hooks: [{ id: mypy }]
  # mypy needs additional_dependencies for project dependencies,
  # ty resolves them via uv from pyproject.toml.
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.101
    hooks:
      - id: ty

  # Secret scanning, included for every project type: the commit hook is the
  # last point before a secret lands in history. Mirrors the gitleaks job of
  # the CI gate. rev comes from `prek update --cooldown-days 7`, which the
  # setup script runs on every setup, and is never hand-pinned. language:
  # golang, so prek fetches a Go toolchain and builds gitleaks on first run.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
